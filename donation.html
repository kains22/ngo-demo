<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate - NGO Demo</title>
    <link rel="stylesheet" href="donation.css">
</head>

<body>
    <header>
        <a href="index.html">← Back to Home</a>
    </header>

    <!-- HERO DONATE -->
    <section class="donate-hero">
        <h1>Help Children, Change a Life</h1>
    </section>

    <!-- DONATION FORM SECTION -->
    <section class="donate-container">

        <!-- Form -->
        <div class="donate-form">
            <h2>Make a Donation</h2>
            <p>Your contribution helps children get access to education and healthcare.</p>

            <form>
                <input type="text" placeholder="Full Name" required>
                <input type="email" placeholder="Email Address" required>
                <input type="number" placeholder="Donation Amount ($)" required>
                <button type="submit" class="btn-primary">Donate Now</button>
            </form>

            <!-- Progress Bar -->
            <div class="progress-bar">
                <div class="progress-fill">
                    $6,500 / $10,000
                </div>
            </div>
        </div>

        <!-- Image / Visual -->
        <div class="donate-image">
            <img src="images/programs/1.jpg" alt="Help Children">
        </div>

    </section>

</body>

</html>
